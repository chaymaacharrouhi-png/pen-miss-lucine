<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Miss Lucine</title>
  <meta name="description" content="Contact Miss Lucine for questions, collaborations, or support.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header container">
    <a class="brand" href="index.html">
      <div class="logo">ML</div>
      <div class="brand-copy">
        <p class="eyebrow">Miss Lucine</p>
        <p class="brand-title">Get in touch</p>
      </div>
    </a>
    <div class="header-actions">
      <button id="menuToggle" class="menu-toggle" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">Theme</button>
      <nav class="site-nav"></nav>
    </div>
  </header>

  <main class="container">
    <section class="section-intro animated">
      <h3>Contact</h3>
      <p>If you have questions, collaboration requests, or would like to support the author directly, use the form below.</p>
    </section>

    <div class="form-card animated">
      <form id="contactForm" name="contact" method="POST" data-netlify="true" class="form-grid">
        <input type="hidden" name="form-name" value="contact">
        <div class="form-control">
          <label for="name">Name</label>
          <input id="name" type="text" name="name" placeholder="Your full name" required>
        </div>
        <div class="form-control">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-control">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Share your thoughts or request" required></textarea>
        </div>
        <button class="btn primary" type="submit">Send Message</button>
      </form>
    </div>

    <footer class="site-footer">
      <div>© <span id="year5"></span> Miss Lucine</div>
      <div>Contact page</div>
    </footer>
  </main>

  <script>document.getElementById('year5').textContent=new Date().getFullYear();
  document.getElementById('contactForm').addEventListener('submit',function(e){
    e.preventDefault();
    alert('Form submitted. Configure your preferred submission service or backend for production.');
  });</script>
</body>
</html>
